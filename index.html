<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="A choice-driven Vanderbilt career story about ambition, integrity, and wellbeing.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>Commodore Crossroads</title>
  <style>
    :root{--black:#fff;--gold:#c9a227;--white:#000}
    *{box-sizing:border-box;font-family:Arial,sans-serif} body{margin:0;min-height:100vh;color:var(--white);background:var(--black);overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 49.9%,#c9a22712 50%,transparent 50.1%)}
    #app{max-width:960px;margin:auto;padding:0 22px}.hud-wrap{position:sticky;top:0;z-index:4;margin:12px 0;padding:16px 18px;background:var(--black)}.hud-wrap:before,.hud-wrap:after{content:"";position:absolute;left:-7px;right:-7px;height:1px;background:#000}.hud-wrap:before{top:0}.hud-wrap:after{bottom:0}.hud{position:static;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-items:start;background:transparent}.hud:before,.hud:after{content:"";position:absolute;top:-7px;bottom:-7px;width:1px;background:#000}.hud:before{left:0}.hud:after{right:0}
    .stat{font-size:.62rem;color:var(--white);text-transform:uppercase;letter-spacing:.07em;display:flex;flex-direction:column;align-items:center;text-align:center}.stat-head{display:flex;flex-direction:column;align-items:center;gap:7px}.hud-icon{width:85px;height:85px;flex:0 0 85px;object-fit:cover;object-position:50% 30%;border:2px solid var(--gold);border-radius:50%;background:var(--black);display:block}.icon-student{object-position:50% 25%}.icon-career{object-position:50% 22%}.icon-integrity{object-position:47% 34%}.icon-wellness{object-position:50% 45%}.stat b{display:block;color:var(--gold);font-size:1.05rem;margin-top:5px;letter-spacing:.02em}.bar{height:4px;width:100%;background:#00000026;margin-top:7px;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
    main{min-height:calc(100vh - 76px);display:grid;place-items:center}.card{width:100%;padding:30px 0;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);background:var(--black);animation:enter .45s ease}
    @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}} .eyebrow{color:var(--gold);letter-spacing:.16em;text-transform:uppercase;font-size:.64rem}h1{font-size:clamp(2.25rem,6vw,4.6rem);line-height:.95;margin:.18em 0}.scene-title{font-size:clamp(1.65rem,4vw,2.7rem);margin:.18em 0 .45em}p{max-width:760px;font-size:.94rem;line-height:1.5;margin:.65em 0}.message{border-left:2px solid var(--gold);padding:10px 15px;margin:16px 0;background:#00000008}.warning{color:var(--white);border-color:var(--gold)}
    .choices{display:grid;gap:7px;margin-top:20px}.choice{width:100%;text-align:left;color:var(--white);background:var(--black);border:1px solid #00000070;padding:11px 14px;font-size:.9rem;line-height:1.25;cursor:pointer;transition:.18s}.choice:before{content:"→";color:var(--gold);margin-right:10px}.choice:hover,.choice:focus{transform:translateX(4px);border-color:var(--gold);color:var(--gold);outline:none}.choice small{display:block;color:var(--white);margin:4px 0 0 24px;opacity:.72}.tag{display:inline-block;padding:5px 8px;border:1px solid var(--gold);color:var(--white);font-size:.65rem;margin:0 5px 4px 0}.danger,.good{color:var(--gold)}
    .clock{font-size:clamp(2.4rem,8vw,5rem);line-height:1;color:var(--gold);text-align:center;margin:18px}.email{background:var(--black);color:var(--white);padding:16px;border:1px solid var(--gold);border-left:5px solid var(--gold)}.email p{font-size:.86rem;color:var(--white)}.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--gold);border:1px solid var(--gold);margin:18px 0}.score-box{text-align:center;padding:14px;background:var(--black)}.score-box b{font-size:1.7rem;display:block;color:var(--gold)}.pulse{animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.45}}@media(max-width:650px){#app{padding:0 8px}.hud-wrap{padding:12px 8px;margin:10px 0}.hud{grid-template-columns:repeat(5,1fr);gap:5px}.hud-icon{width:60px;height:60px;flex-basis:60px;border-width:1.5px}.stat{font-size:.5rem;letter-spacing:.02em}.stat-head{gap:5px}.stat b{font-size:.82rem}.bar{height:3px}.card{padding:24px 0}.scene-title{font-size:1.65rem}.choices{margin-top:16px}.score-grid{grid-template-columns:1fr}}
  </style>
</head>
<body><div id="app"><div class="hud-wrap"><div class="hud" id="hud"></div></div><main id="stage"></main></div>
<script>
const initial={career:0,integrity:0,wellness:0,days:30,path:'Undecided',resume:'none',prepared:false,friend:false,favor:false,offer:'none',history:[]};
let s={...initial};
const scenes={
start:{part:'Person 1 • Mission One',title:'Commodore Crossroads',body:`<div class="eyebrow">Thirty days until graduation</div><h1>Choose Your Life<br>After Vanderbilt</h1><p>It is 11:57 p.m. The campus is quiet—too quiet. Your laptop flashes, your phone vibrates, and somewhere outside, a squirrel knocks over a trash can with the confidence of a tenured professor.</p><div class="message warning">UNKNOWN: “Thirty days. Three doors. One future. Every choice will follow you.”</div><p>Your mission is to graduate with a future, a conscience, and—if possible—your sanity.</p>`,choices:[['Begin the countdown','family']]},
family:{part:'Passage 2 • The Pressure Call',title:'Your Family Is Calling',body:`<p>Your family asks the question every senior fears:</p><div class="message">“So…do you have a job yet?”</div><p>You stare at your unopened rejection emails. One subject line reads, “Exciting Update!” It was not exciting.</p>`,choices:[['Tell the truth: “I am still figuring it out.”','invitation',{integrity:2,wellness:1}],['Say, “Everything is under control.”','invitation',{career:1,integrity:-1}],['Promise you will become a lawyer or doctor','invitation',{wellness:-2,career:1}]]},
invitation:{part:'Passage 3 • The Secret Invitation',title:'11:59 P.M.',body:`<p>A black envelope slides under your dorm-room door. On it is a gold Vanderbilt “V.”</p><div class="message warning">REPORT TO THE CAREER VAULT BEFORE MIDNIGHT.<br>BRING YOUR RÉSUMÉ.<br>COME ALONE.</div><p>You open the door. The hallway is empty. Even the RA has vanished—which, honestly, is the least believable part.</p>`,choices:[['Follow the gold arrows downstairs','resume'],['Call a friend and go together','resume',{friend:true,wellness:1}]]},
resume:{part:'Passage 4 • The Résumé Test',title:'The Scanner Wants the Truth',body:`<p>A steel door blocks the basement. A scanner speaks:</p><div class="message">“One line on your résumé determines entry. Select carefully. This record cannot be erased.”</div>`,choices:[['Use only your real experience','vault',{resume:'honest',integrity:3}],['Make a small internship sound much bigger','vault',{resume:'exaggerated',career:2,integrity:-2}],['Invent an elite internship','vault',{resume:'fake',career:4,integrity:-5}]]},
vault:{part:'Passage 5 • The Career Vault',title:'Three Doors. One Deadline.',body:`<p>The door opens onto an impossible underground hall. Three elevators wait beneath flickering signs.</p><p><span class="tag">THE COURTROOM</span><span class="tag">THE CORPORATE TOWER</span><span class="tag">THE RESEARCH LAB</span></p><p>A voice whispers: “Prestige has a price. Purpose has a price. Indecision also has a price—usually with interest.”</p>`,choices:[['Approach the three elevators','choose',{days:-3}]]},
choose:{part:'Passage 6 • Choose Your Mission',title:'Select Your Future',body:`<p>The floor shakes. You have ten seconds before the elevators lock.</p><div class="clock">00:10</div><p>This choice opens your first career mission. It does not guarantee your ending.</p>`,choices:[['Enter the Courtroom','careerLaw',{path:'Law'}],['Enter the Corporate Tower','careerFinance',{path:'Finance & Consulting'}],['Enter the Research Laboratory','careerResearch',{path:'Medicine & Research'}]]},
careerLaw:{part:'Person 2 • Passage 7',title:'The Courtroom Mission',body:`<p>A law firm offers you a final interview. Its salary could change your family’s life. Then a confidential file appears: the firm is defending a corporation accused of poisoning a low-income neighborhood.</p><div class="message warning">MISSION: Decide before the partner returns.</div>`,choices:[['Accept and say nothing','submitted',{career:3,integrity:-3}],['Question the recruiter about the case','submitted',{career:1,integrity:2}],['Reject the firm and protect your values','submitted',{career:-1,integrity:4}]]},
careerFinance:{part:'Person 2 • Passage 8',title:'The Corporate Tower',body:`<p>A consulting firm offers a path toward a six-figure salary. An exhausted analyst traps you in the elevator.</p><div class="message">“The money is real. So are the 2 a.m. emails. Yesterday, I called my houseplant ‘Mom.’”</div>`,choices:[['Chase the salary and prestige','submitted',{career:4,wellness:-3}],['Investigate the company’s practices','submitted',{career:1,integrity:2}],['Choose a smaller mission-driven firm','submitted',{career:1,integrity:2,wellness:2}]]},
careerResearch:{part:'Person 2 • Passage 9',title:'The Locked Laboratory',body:`<p>A professor offers you a prestigious research position. On the desk, you find notes proving another student created the original idea but received no credit.</p><p>The professor’s footsteps approach. You have seconds.</p>`,choices:[['Accept the position and hide the notes','submitted',{career:4,integrity:-4}],['Demand shared credit for the student','submitted',{career:1,integrity:4}],['Photograph the evidence and contact the student','submitted',{integrity:3,wellness:1,friend:true}]]},
submitted:{part:'Passage 10 • Application Submitted',title:'Decision Pending',body:`<div class="email"><b>APPLICATION STATUS</b><p>We received your materials. Twelve finalists remain. A decision will arrive after an internal review.</p></div><p class="pulse">Three days pass. Then four. Then five.</p><p>Your roommate says, “Maybe they are being thoughtful.” Your inbox says nothing.</p>`,choices:[['Enter the waiting room','waiting',{days:-7}]]},
waiting:{part:'Passage 11 • Side Mission',title:'The Waiting Room',body:`<p>The interview remains locked. You have one night to prepare—or distract yourself from the terror.</p><div class="message">SIDE MISSION: How will you spend the night?</div>`,choices:[['Practice answers until midnight','interview',{prepared:true,career:3,wellness:-1}],['Help a nervous friend prepare','interview',{prepared:true,friend:true,integrity:2,wellness:2}],['Attend a party and ignore everything','interview',{prepared:false,career:-2,wellness:3}],['Investigate the mysterious recruiter','interview',{prepared:true,career:1,integrity:1}]]},
interview:{part:'Passage 12 • Boss Battle',title:'The Interview Battle',body:()=>`<p>The camera turns on. Six interviewers stare silently. One asks:</p><div class="message warning">“Why should we trust you when everyone here wants the same future?”</div><p>${s.prepared?'You prepared. Your hands still shake, but your mind is ready.':'You did not prepare. Your brain offers one useful thought: run.'}</p>`,choices:()=>s.prepared?[["Tell a truthful story about failure",'rejection',{career:2,integrity:3}],["Give the polished answer they want",'rejection',{career:4,integrity:-1}]]:[["Admit you are nervous and answer honestly",'rejection',{integrity:2,career:-1}],["Invent a heroic leadership story",'rejection',{career:2,integrity:-4}]]},
rejection:{part:'Passage 13 • The Fall',title:'“Unfortunately…”',body:`<div class="email"><b>SUBJECT: Your Application</b><p>Thank you for your interest. Unfortunately, we have decided—</p></div><p>The screen goes black before you finish. Then your phone rings from a blocked number.</p>`,choices:[['Answer the blocked call','offer'],['Throw the phone onto the bed, then answer it anyway','offer',{wellness:1}]]},
offer:{part:'Passage 14 • The Devil’s Shortcut',title:'The Unexpected Offer',body:`<p>A powerful alumnus speaks quietly:</p><div class="message warning">“I can reverse the rejection. No more interviews. No questions. But someday, I will ask you for one favor.”</div><p>Thunder strikes outside. Your weather app says clear skies.</p>`,choices:[['Accept the secret arrangement','check',{favor:true,offer:'shortcut',career:5,integrity:-4}],['Ask what the favor will be','check',{favor:true,offer:'questioned',integrity:1}],['Reject the offer completely','check',{favor:false,offer:'rejected',integrity:4,career:-1}]]},
check:{part:'Person 3 • Passage 15',title:'Background Check',body:()=>{if(s.resume==='honest')return `<p class="good">VERIFIED.</p><p>Every résumé line survives inspection. The investigator closes the file—but notices the alumnus’s number in your call log.</p>`;if(s.resume==='exaggerated')return `<p class="danger">DISCREPANCY FOUND.</p><p>Your title and duties do not match the employer’s records. A compliance officer gives you sixty seconds to explain.</p>`;return `<p class="danger">FRAUD ALERT.</p><p>The invented internship does not exist. Security freezes your application. The lie from Mission One has returned.</p>`},choices:()=>s.resume==='honest'?[["Continue with your record intact",'twoOffers',{career:2,integrity:2}]]:s.resume==='exaggerated'?[["Admit you exaggerated",'twoOffers',{career:-2,integrity:2}],["Defend the claim and blame HR",'twoOffers',{career:-1,integrity:-4}]]:[["Confess before they finish",'twoOffers',{career:-5,integrity:1,offer:'lost'}],["Create another lie to cover it",'twoOffers',{career:-7,integrity:-6,offer:'lost'}]]},
twoOffers:{part:'Passage 16 • Final Countdown',title:'Two Offers. One Hour.',body:()=>`<p>${s.offer==='lost'?'Your original offer is gone—but two unexpected doors remain open.':'Against every reasonable prediction, two contracts arrive.'}</p><div class="message">OFFER A: $125,000, prestige, brutal hours, questionable mission.<br><br>OFFER B: $62,000, meaningful work, uncertain future.</div><div class="clock">59:59</div>`,choices:[['Choose prestige and financial security','emergency',{offer:'prestige',career:5,wellness:-4}],['Choose meaningful work','emergency',{offer:'purpose',career:1,integrity:3,wellness:3}],['Reject both and build something new','emergency',{offer:'founder',career:2,wellness:-1}]]},
emergency:{part:'Passage 17 • The Emergency',title:'The Call From Home',body:`<p>Minutes before signing, your family calls. Someone you love needs immediate support. Your career choice now affects more than you.</p><p>The contract expires at midnight. The last flight leaves in ninety minutes.</p>`,choices:[['Go home immediately','betrayal',{integrity:3,wellness:3,career:-2}],['Sign first, then find another way to help','betrayal',{career:3,wellness:-2}],['Call your network and build a compromise','betrayal',{career:1,integrity:2,wellness:1}]]},
betrayal:{part:'Passage 18 • The Betrayal Test',title:'Your Friend’s Secret',body:()=>`<p>Your friend—the one ${s.friend?'you helped earlier':'who competed against you'}—is the other finalist. A leaked file could destroy their future and guarantee yours.</p><div class="message warning">FINAL ETHICAL TEST: Nobody will know what you choose.</div>`,choices:[['Use the file against your friend','graduation',{career:5,integrity:-7,wellness:-3}],['Delete the file and warn your friend','graduation',{integrity:5,wellness:2}],['Report the leak without opening it','graduation',{integrity:4,career:1}]]},
graduation:{part:'Passage 19 • Graduation Day',title:'The Last Walk',body:()=>{const e=ending();return `<p>The stadium roars. Your name is called. For one strange second, time stops.</p><div class="score-grid"><div class="score-box"><b>${s.career}</b>Career</div><div class="score-box"><b>${s.integrity}</b>Integrity</div><div class="score-box"><b>${s.wellness}</b>Wellness</div></div><h2>${e.name}</h2><p>${e.text}</p><div class="message">You earned a Vanderbilt degree. But did you choose your own life?</div>`},choices:[['Read the creators’ reflection','reflection'],['Play again and challenge your fate','start',{reset:true}]]},
reflection:{part:'Passage 20 • Reflection & Bibliography',title:'Behind the Crossroads',body:`<h3>Group Reflection</h3><p>We designed this story as a mission-based journey because career decisions rarely happen in a straight line. The three career doors create nonlinear pathways, while shared scenes reconnect the narrative and show that students in different fields still face pressure, rejection, uncertainty, and ethical choices.</p><p>Early decisions return later: résumé honesty affects the background check, preparation affects the interview, and relationships affect the final test. Career, Integrity, and Wellness scores demonstrate that “success” has several meanings. Humor makes the story inviting, while countdowns, mysterious messages, sound, visual effects, and delayed results create pressure and audience engagement.</p><p>We avoided presenting one career or family background as universally correct. Instead, outcomes show tradeoffs and encourage players to replay the story from another perspective.</p><h3>Team Contributions</h3><p><b>Person 1:</b> Passages 1–6, opening mystery, identity pressure, résumé dilemma, career selection.<br><b>Person 2:</b> Passages 7–14, career missions, waiting game, interview, rejection, secret offer.<br><b>Person 3:</b> Passages 15–20, consequences, final crisis, endings, technical testing, reflection.</p><h3>Starter Bibliography</h3><p>Vanderbilt University Career Center. Career exploration and preparation resources.<br>Twine. <i>Twine Reference and Documentation.</i><br>Group-created narrative, dialogue, scoring system, and original ethical dilemmas.</p><p><i>Replace or expand this bibliography with the exact sources and media your group uses before submitting.</i></p>`,choices:[['Return to graduation','graduation'],['Restart the entire story','start',{reset:true}]]}
};
function ending(){if(s.integrity<=-8)return{name:'THE FALLEN COMMODORE',text:'You secured attention, but your decisions became public. The offer disappears. Your final mission is rebuilding trust.'};if(s.career>=16&&s.wellness<=0)return{name:'THE GOLDEN HANDCUFFS',text:'You reach the top quickly. The salary is enormous. So is the emptiness in your calendar where your life used to be.'};if(s.integrity>=15&&s.wellness>=8&&s.career>=8)return{name:'SECRET ENDING: VANDERBILT LEGEND',text:'You balance ambition, honesty, and humanity. You do not find a perfect future—you build a responsible one.'};if(s.offer==='founder')return{name:'THE UNEXPECTED FOUNDER',text:'You reject the script and build your own organization. It is terrifying, unstable, and completely yours.'};if(s.offer==='purpose')return{name:'THE PURPOSEFUL COMMODORE',text:'Your beginning is modest, but your work matches your values. Success grows more slowly—and more honestly.'};if(s.career>=13)return{name:'THE RISING STAR',text:'Your ambition carries you into a powerful career. Whether it becomes freedom or another maze depends on what you do next.'};return{name:'THE CROSSROADS ENDING',text:'You graduate without every answer. For the first time, uncertainty feels less like failure and more like possibility.'}}
function apply(change={}){if(change.reset){s={...initial,history:[]};return}for(const [k,v] of Object.entries(change)){if(['career','integrity','wellness','days'].includes(k))s[k]+=v;else s[k]=v}}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=520;g.gain.setValueAtTime(.06,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.18);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.18)}catch(e){}}
function go(id,change={}){apply(change);s.history.push(id);beep();render(id);scrollTo({top:0,behavior:'smooth'})}
function val(x){return typeof x==='function'?x():x}
function render(id){const x=scenes[id];const stats=[
  {name:'Days',value:Math.max(0,s.days),max:30,image:'assets/images/days-clock.png',alt:'Vanderbilt clock',className:''},
  {name:'Career',value:s.career,max:20,image:'assets/images/career-chancellor.png',alt:'Vanderbilt chancellor',className:'icon-career'},
  {name:'Integrity',value:s.integrity,max:20,image:'assets/images/integrity-tower.png',alt:'Kirkland Hall tower',className:'icon-integrity'},
  {name:'Wellness',value:s.wellness,max:20,image:'assets/images/wellness-vumc.png',alt:'VUMC mark',className:'icon-wellness'}
];document.getElementById('hud').innerHTML=`<div class="stat brand"><div class="stat-head"><img class="hud-icon icon-student" src="assets/images/student-alex-hormozi.png" alt="Student character"><span>Student</span></div><b>${s.path}</b></div>${stats.map(o=>`<div class="stat"><div class="stat-head"><img class="hud-icon ${o.className}" src="${o.image}" alt="${o.alt}"><span>${o.name}</span></div><b>${o.value}</b><div class="bar"><i style="width:${Math.max(0,Math.min(100,(o.value/o.max)*100))}%"></i></div></div>`).join('')}`;const choices=val(x.choices)||[];document.getElementById('stage').innerHTML=`<section class="card"><div class="eyebrow">${x.part}</div><h2 class="scene-title">${x.title}</h2>${val(x.body)}<div class="choices">${choices.map((c,i)=>`<button class="choice" data-i="${i}">${c[0]}${c[3]?`<small>${c[3]}</small>`:''}</button>`).join('')}</div></section>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const c=choices[+b.dataset.i];go(c[1],c[2]||{})})}
render('start');
</script></body></html>
